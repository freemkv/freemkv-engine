[package]
name = "freemkv-engine"
version = "1.8.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "freemkv rip engine — disc→MKV orchestration over libfreemkv, shared by every front-end (CLI, autorip, desktop UI)"
repository = "https://github.com/freemkv/freemkv-engine"
keywords = ["bluray", "uhd", "dvd", "ripper", "backup"]
categories = ["multimedia"]
exclude = ["CLAUDE.md"]
# OFF crates.io: transitively git-deps libfreemkv (which git-deps the firmware
# crate). Consumed only by git tag / local path, exactly like libfreemkv and
# freemkv-keysources.
publish = false

[dependencies]
anyhow = "1"
libfreemkv = "1.8"
freemkv-keysources = "1.8"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
# Language-tag normalization for stream selection (name / 639-1 / 639-2/3 →
# language identity). `lowercase_names` enables case-insensitive name matching
# (`from_name_lowercase`) so `-a english` works, not just `-a English`.
isolang = { version = "2", features = ["lowercase_names"] }
# SHA-256 mapfile fingerprints (keys-upfront KU §4.1): the VID and legacy keys are
# kept only as `SHA-256(tag ‖ bytes)`, exactly as libfreemkv's key set computes them.
sha2 = "0.11"

[dev-dependencies]
# Temp dirs / files for the relocated recovery regression suites (mirrors
# libfreemkv's dev-dependency).
tempfile = "3"
# `test_util` fixtures (`aacs_state`, …) for this crate's tests (keys-upfront
# KU-P1). CI resolves it through the sibling path patch.
libfreemkv = { version = "1.8", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Resolve libfreemkv + freemkv-keysources from their GIT TAGS (both OFF
# crates.io — see libfreemkv/Cargo.toml). This committed [patch.crates-io] is
# the CI resolution path; freemkv's release-orchestrate.yml rewrites the tags
# on bump. Local dev overrides it with a path patch via the gitignored
# .cargo/config.toml.
[patch.crates-io]
libfreemkv = { git = "https://github.com/freemkv/libfreemkv", tag = "v1.8.3" }
freemkv-keysources = { git = "https://github.com/freemkv/freemkv-keysources", tag = "v1.8.3" }
freemkv-unlock = { git = "https://github.com/freemkv/freemkv-unlock", tag = "v1.8.3" }

[lints.clippy]
uninlined_format_args = "allow"
