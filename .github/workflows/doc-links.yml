name: doc-links

# Thin caller → the canonical reusable doc-links gate in freemkv/.github.
# freemkv-engine patches libfreemkv + freemkv-keysources from git tags, so the
# reusable gate checks them out as siblings (plus freemkv-unlock, which
# libfreemkv path-deps) and resolves the toolchain from rust-version.
on: [push, pull_request]
# Least privilege: the reusable guard only reads the repo.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  doc-links:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    uses: freemkv/.github/.github/workflows/guard-doclinks.yml@v2
    with:
      self: freemkv-engine
      checkout: libfreemkv freemkv-keysources freemkv-unlock
      patch: libfreemkv freemkv-keysources
