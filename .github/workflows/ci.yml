name: CI

on:
  push:
    # dev -> qa -> main. `dev` is where work lands and is meant to be pushed
    # to often: these are the FAST checks, so a mistake surfaces in minutes.
    # `qa` is the release candidate — it runs these too, plus the expensive
    # suite in qa.yml. `main` only ever moves at release time, to a tagged
    # commit that was already green on qa.
    branches: [main, dev, qa]
  pull_request:

# Rapid dev/PR pushes supersede their own in-progress runs; an in-progress
# qa/main run is never cancelled (a queued one may be replaced by a newer push).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name == 'dev' || github.event_name == 'pull_request' }}

# Least privilege: no job here writes to the repo (Codecov uses its own secret).
permissions:
  contents: read

# WHY THE SIBLING CHECKOUTS — this is NOT a monorepo.
#
# The committed Cargo.toml resolves libfreemkv and freemkv-keysources from git
# TAGS (both are off crates.io), so CI would otherwise build this branch against
# the LAST RELEASE of both. For this crate that is not theoretical: the 1.6.0
# recovery layer MOVED here out of libfreemkv, so the dev tip imports symbols the
# last tag does not export. No arrangement of tags could fix it — the tag that
# satisfies this branch does not exist until release-orchestrate.yml creates it.
#
# The shared `checkout-siblings` composite (freemkv/.github) reproduces the
# developer's local layout: every repo is cloned into a subdirectory of
# $GITHUB_WORKSPACE and a generated .cargo/config.toml redirects the git-tag
# patches at those paths. It resolves siblings 3-way from the caller branch —
# qa->qa, main->main, else dev — so a push to main validates against sibling
# MAIN (the old inline checkout always used dev, the bug this fixes).
#
# `--locked` is deliberately absent: the sibling path-patch layout resolves the
# freemkv crates as path packages, which `--locked` can't satisfy — the same
# reason the binary crates omit it.

jobs:
  # ── Single source of truth for the MSRV ─────────────────────────────────────
  #
  # `rust-version` in Cargo.toml is the ONE place the MSRV is declared. This job
  # reads it; every job that must build/test AT the MSRV consumes
  # `needs.resolve-msrv.outputs.v` instead of a hardcoded pin, so the floor
  # cannot drift out of sync across workflow files. The `test` job building
  # green at this value IS the verification that the declared MSRV is real.
  # clippy and the `consumers` job deliberately do NOT use it — they run on
  # `stable` (lint debt is caught against current Rust; dependents float highest).
  resolve-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      v: ${{ steps.msrv.outputs.v }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: msrv
        shell: bash
        run: echo "v=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*\"([^\"]+)\".*/\1/')" >> "$GITHUB_OUTPUT"

  # CI owns the changelog: main may never carry a released version without a
  # CHANGELOG.md entry for it. The release orchestrator dates an existing
  # `## [X.Y.Z]` heading — it does NOT invent one — so a version bump that
  # forgot its changelog entry must fail here rather than ship a blank release.
  # Hard-fails on main (and PRs targeting main); warns elsewhere so an
  # in-progress dev/qa branch whose entry isn't written yet is not blocked.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require a CHANGELOG entry for the crate version on main
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has an entry for ${version}."
            exit 0
          fi
          msg="CHANGELOG.md has no '## [${version}]' entry"
          if [ "${GITHUB_REF_NAME:-}" = "main" ] || [ "${GITHUB_BASE_REF:-}" = "main" ]; then
            echo "::error::${msg} — main requires a changelog entry for the released version."
            exit 1
          fi
          echo "::warning::${msg} (allowed on ${GITHUB_REF_NAME:-unknown}; required before it can reach main)."

  lint:
    needs: resolve-msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: freemkv-engine
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          self: freemkv-engine
          checkout: libfreemkv freemkv-keysources freemkv-unlock
          patch: libfreemkv freemkv-keysources
      # fmt runs on the pinned MSRV toolchain; clippy runs on stable. Linting on
      # stable makes new-lint debt a BLOCKING gate the pinned version would hide.
      # The MSRV pin is installed second so it stays the default (fmt uses it
      # implicitly); clippy is invoked explicitly with `+stable`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.resolve-msrv.outputs.v }}
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: freemkv-engine
      - run: cargo fmt --check
        working-directory: freemkv-engine
      # --all-targets so the test code is linted too, not just the library.
      - run: cargo +stable clippy --all-targets -- -D warnings
        working-directory: freemkv-engine

  test:
    needs: resolve-msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: freemkv-engine
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          self: freemkv-engine
          checkout: libfreemkv freemkv-keysources freemkv-unlock
          patch: libfreemkv freemkv-keysources
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.resolve-msrv.outputs.v }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: freemkv-engine
      - run: cargo test --tests
        working-directory: freemkv-engine

  # cargo-deny — gates the RESOLVED dependency graph (RUSTSEC advisories, a
  # permissive licence allow-list, and source/ban hygiene). Takes the sibling
  # checkout + path-patch so `cargo metadata` resolves the path-patched siblings
  # exactly like the real build.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: freemkv-engine
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          self: freemkv-engine
          checkout: libfreemkv freemkv-keysources freemkv-unlock
          patch: libfreemkv freemkv-keysources
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
          manifest-path: freemkv-engine/Cargo.toml

  # The release profile is a DIFFERENT program. `[profile.release]` sets lto and
  # codegen-units but not debug-assertions, so every debug_assert! in the
  # recovery layer compiles out — and the last audit found defects that only
  # exist in that build, one of them shipping a wrong artifact at exit 0. The
  # dev-profile suite above cannot see them. Optimisation also changes overflow
  # behaviour (wrapping instead of panicking), which recovery arithmetic cares
  # about. Cheap enough to run every push.
  test-release:
    needs: resolve-msrv
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: freemkv-engine
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          self: freemkv-engine
          checkout: libfreemkv freemkv-keysources freemkv-unlock
          patch: libfreemkv freemkv-keysources
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.resolve-msrv.outputs.v }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: freemkv-engine
      - run: cargo test --release --tests
        working-directory: freemkv-engine

  # The engine is the rip orchestrator for every front-end, so it ships on all
  # three desktop OSes. Build the tests, not `cargo check` — check skips codegen
  # and never compiles test-only code.
  check-macos:
    # dev is the FAST lane: this job still runs, but on the release-candidate
    # branches rather than on every push to dev. Nothing is deleted and no
    # platform stops being checked before a release -- qa.yml independently
    # covers macOS and Windows (release profile), and these debug-profile test
    # builds (macOS arm64, Windows) run here on qa and main. A push
    # to dev is meant to be cheap and frequent; waiting on three runner pools
    # to agree is what a release candidate is for.
    #
    # `if` SKIPS the job (it does not queue). A queued job would be far worse
    # than a slow one: a never-scheduled job leaves the run pending forever, so
    # the branch's required checks never report complete.
    needs: resolve-msrv
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: freemkv-engine
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          self: freemkv-engine
          checkout: libfreemkv freemkv-keysources freemkv-unlock
          patch: libfreemkv freemkv-keysources
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.resolve-msrv.outputs.v }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: freemkv-engine
      - run: cargo build --tests
        working-directory: freemkv-engine

  check-windows:
    # dev is the FAST lane: this job still runs, but on the release-candidate
    # branches rather than on every push to dev. Nothing is deleted and no
    # platform stops being checked before a release -- qa.yml independently
    # covers macOS and Windows (release profile), and these debug-profile test
    # builds (macOS arm64, Windows) run here on qa and main. A push
    # to dev is meant to be cheap and frequent; waiting on three runner pools
    # to agree is what a release candidate is for.
    #
    # `if` SKIPS the job (it does not queue). A queued job would be far worse
    # than a slow one: a never-scheduled job leaves the run pending forever, so
    # the branch's required checks never report complete.
    needs: resolve-msrv
    if: github.ref_name == 'qa' || github.ref_name == 'main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: freemkv-engine
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          self: freemkv-engine
          checkout: libfreemkv freemkv-keysources freemkv-unlock
          patch: libfreemkv freemkv-keysources
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.resolve-msrv.outputs.v }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: freemkv-engine
      - run: cargo build --tests
        working-directory: freemkv-engine

  # ── Did this change break the front-ends? ───────────────────────────────────
  #
  # Every other job here proves the ENGINE still builds. None of them proves
  # its CONSUMERS do, and that gap is not theoretical: a signature change to
  # `end_of_recovery_promotion` once broke autorip (then a consumer; it has
  # since left the release) and nothing rebuilt it against the new engine,
  # so the breakage sat undetected — consumer CI only fires on a push to that
  # consumer. freemkv is the one consumer checked below.
  #
  # Making each repo build its own branch tip fixed the first version of this
  # problem; this fixes the same blind spot one level up, at the seam between
  # repos. The library is the thing that changed, so the library is where the
  # question gets asked.
  #
  # `cargo check --all-targets` rather than a full test run: the consumers have
  # their own CI for their own behaviour. What is being answered here is only
  # "does everything that depends on me still compile against this commit",
  # which is exactly the failure that went unnoticed.
  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: freemkv-engine
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          checkout: libfreemkv freemkv-keysources freemkv-unlock freemkv-i18n freemkv
      - name: Point the consumer at THIS engine commit
        shell: bash
        run: |
          for c in freemkv; do
            mkdir -p "$c/.cargo"
            cat > "$c/.cargo/config.toml" <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
          done
      # freemkv's app build (`--features gui`) compiles a GTK4 + libadwaita
      # shell, so checking it needs these pkg-config dev headers.
      - name: Install GTK4 + libadwaita development headers (for freemkv)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev build-essential
      # The consumer (freemkv) tracks a higher MSRV than the engine —
      # the binaries always float to the highest supported Rust. Build them on
      # `stable` so this job satisfies that floor; the engine's own lower MSRV
      # (verified by the `test` job) cannot compile them.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            freemkv
      - run: cargo check --all-targets
        working-directory: freemkv
      - run: cargo check --all-targets --features gui
        working-directory: freemkv

  # Coverage — additive, NON-REQUIRED (not wired into any release gate; failure
  # here does not block a push or a release). Mirrors the `test` job's sibling
  # checkout + path-patch layout so llvm-cov builds this branch's tip against the
  # sibling tips, exactly like the real test build. Uploads to Codecov and never
  # fails CI on upload error.
  coverage:
    needs: resolve-msrv
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: freemkv-engine
      - uses: freemkv/.github/.github/actions/checkout-siblings@v1
        with:
          self: freemkv-engine
          checkout: libfreemkv freemkv-keysources freemkv-unlock
          patch: libfreemkv freemkv-keysources
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.resolve-msrv.outputs.v }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: freemkv-engine
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --ignore-run-fail --lcov --output-path lcov.info
        working-directory: freemkv-engine
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: freemkv-engine/lcov.info
          slug: freemkv/freemkv-engine
          fail_ci_if_error: false
