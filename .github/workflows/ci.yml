name: CI

on:
  push:
    # dev -> qa -> main. `dev` is where work lands and is meant to be pushed
    # to often: these are the FAST checks, so a mistake surfaces in minutes.
    # `qa` is the release candidate — it runs these too, plus the expensive
    # suite in qa.yml. `main` only ever moves at release time, to a tagged
    # commit that was already green on qa.
    branches: [main, dev, qa]
  pull_request:

# WHY THE SIBLING CHECKOUTS — this is NOT a monorepo.
#
# The committed Cargo.toml resolves libfreemkv and freemkv-keysources from git
# TAGS (both are off crates.io), so CI was building this branch against the LAST
# RELEASE of both. For this crate that was not a theoretical gap: the 1.6.0
# recovery layer MOVED here out of libfreemkv, so the dev tip imports symbols
# (SenseFamily, MuxInput, DiscSession, extract_scsi_context) that the v1.5.2 tag
# does not export. Every run failed on unresolved imports, and no arrangement of
# tags could have fixed it — the tag that satisfies this branch does not exist
# until release.sh creates it.
#
# The fix mirrors the developer's local layout. Every repo is checked out into a
# subdirectory of $GITHUB_WORKSPACE, reproducing
# ~/Developer/freemkv/{freemkv-engine,libfreemkv,freemkv-keysources,freemkv-unlock},
# and a generated .cargo/config.toml redirects the git-tag patches at those
# paths. Config-level [patch.crates-io] wins over the manifest one — the same
# mechanism local development already uses.
#
# Subdirectories rather than `../libfreemkv` because actions/checkout refuses
# any `path:` outside $GITHUB_WORKSPACE, and the workspace IS the repo dir.
# Repos stay separate, tags stay separate, the release cascade is untouched.
#
# libfreemkv path-deps ../freemkv-unlock, which resolves to the workspace root
# under this layout — hence the fourth checkout.
#
# `--locked` is deliberately absent: Cargo.lock is gitignored here (library
# convention), so there is nothing to lock against. The lock that has to hold is
# the one release.sh regenerates in each consuming binary.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: freemkv-engine
      - uses: actions/checkout@v5
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: freemkv-engine
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          EOF
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv-engine
      - run: cargo fmt --check
        working-directory: freemkv-engine
      # --all-targets so the test code is linted too, not just the library.
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: freemkv-engine

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: freemkv-engine
      - uses: actions/checkout@v5
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: freemkv-engine
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          EOF
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv-engine
      - run: cargo test --tests
        working-directory: freemkv-engine

  # The release profile is a DIFFERENT program. `[profile.release]` sets lto and
  # codegen-units but not debug-assertions, so every debug_assert! in the
  # recovery layer compiles out — and the last audit found defects that only
  # exist in that build, one of them shipping a wrong artifact at exit 0. The
  # dev-profile suite above cannot see them. Optimisation also changes overflow
  # behaviour (wrapping instead of panicking), which recovery arithmetic cares
  # about. Cheap enough to run every push.
  test-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: freemkv-engine
      - uses: actions/checkout@v5
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: freemkv-engine
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          EOF
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv-engine
      - run: cargo test --release --tests
        working-directory: freemkv-engine

  # The engine is the rip orchestrator for every front-end, so it ships on all
  # three desktop OSes. Build the tests, not `cargo check` — check skips codegen
  # and never compiles test-only code.
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: freemkv-engine
      - uses: actions/checkout@v5
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: freemkv-engine
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          EOF
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv-engine
      - run: cargo build --tests
        working-directory: freemkv-engine

  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: freemkv-engine
      - uses: actions/checkout@v5
        with:
          repository: freemkv/libfreemkv
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: libfreemkv
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-keysources
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-keysources
      - uses: actions/checkout@v5
        with:
          repository: freemkv/freemkv-unlock
          ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}"
          path: freemkv-unlock
      - name: Resolve siblings from their dev tips
        shell: bash
        working-directory: freemkv-engine
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          EOF
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: freemkv-engine
      - run: cargo build --tests
        working-directory: freemkv-engine

  # ── Did this change break the front-ends? ───────────────────────────────────
  #
  # Every other job here proves the ENGINE still builds. None of them proves
  # its CONSUMERS do, and that gap is not theoretical: a signature change to
  # `end_of_recovery_promotion` landed at 22:37 and broke autorip, whose last
  # CI run had been at 21:06. Nothing rebuilt autorip against the new engine,
  # so the breakage sat undetected — consumer CI only fires on a push to that
  # consumer, and nobody had pushed one.
  #
  # Making each repo build its own branch tip fixed the first version of this
  # problem; this fixes the same blind spot one level up, at the seam between
  # repos. The library is the thing that changed, so the library is where the
  # question gets asked.
  #
  # `cargo check --all-targets` rather than a full test run: the consumers have
  # their own CI for their own behaviour. What is being answered here is only
  # "does everything that depends on me still compile against this commit",
  # which is exactly the failure that went unnoticed.
  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: freemkv-engine
      - uses: actions/checkout@v5
        with: { repository: freemkv/libfreemkv, ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}", path: libfreemkv }
      - uses: actions/checkout@v5
        with: { repository: freemkv/freemkv-keysources, ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}", path: freemkv-keysources }
      - uses: actions/checkout@v5
        with: { repository: freemkv/freemkv-unlock, ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}", path: freemkv-unlock }
      - uses: actions/checkout@v5
        with: { repository: freemkv/freemkv-i18n, ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}", path: freemkv-i18n }
      - uses: actions/checkout@v5
        with: { repository: freemkv/freemkv, ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}", path: freemkv }
      - uses: actions/checkout@v5
        with: { repository: freemkv/autorip, ref: "${{ github.ref_name == 'qa' && 'qa' || 'dev' }}", path: autorip }
      - name: Point both consumers at THIS engine commit
        shell: bash
        run: |
          for c in freemkv autorip; do
            mkdir -p "$c/.cargo"
            cat > "$c/.cargo/config.toml" <<'EOF'
          [patch.crates-io]
          libfreemkv = { path = "../libfreemkv" }
          freemkv-keysources = { path = "../freemkv-keysources" }
          freemkv-engine = { path = "../freemkv-engine" }
          freemkv-i18n = { path = "../freemkv-i18n" }
          EOF
          done
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            freemkv
            autorip
      - run: cargo check --all-targets
        working-directory: freemkv
      - run: cargo check --all-targets
        working-directory: autorip
